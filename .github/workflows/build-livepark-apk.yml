name: Build LivePark Stage 1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/livepark-mvp-stage1-to-6-17072672878720083729
    paths:
      - mobile/**
      - .github/workflows/build-livepark-apk.yml

permissions:
  contents: write

concurrency:
  group: livepark-stage1-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: "1"
      EXPO_PUBLIC_SUPABASE_URL: https://bubgoydtxbaefwwemefp.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ZYFfjQcbN34FFppHqJubDQ_0R9iPu55

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out Stage 1 branch
        uses: actions/checkout@v4

      - name: Use Node.js required by Expo 57
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Check Expo dependency versions
        run: npx expo install --check

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
        working-directory: mobile/android

      - name: Prepare the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk LivePark-stage1.apk

      - name: Store the APK in the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: LivePark-stage1-APK
          path: mobile/LivePark-stage1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish a direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "stage1-apk-${GITHUB_RUN_NUMBER}"
          LivePark-stage1.apk
          --repo "${GITHUB_REPOSITORY}"
          --target "${GITHUB_SHA}"
          --title "LivePark Stage 1 APK #${GITHUB_RUN_NUMBER}"
          --notes "Installable Android APK built from ${GITHUB_SHA} on ${GITHUB_REF_NAME}. This is an MVP test build, not a Play Store release."
          --prerelease
