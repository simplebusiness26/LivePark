name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  build-android:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: "1"
      EXPO_PUBLIC_SUPABASE_URL: https://bubgoydtxbaefwwemefp.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ZYFfjQcbN34FFppHqJubDQ_0R9iPu55

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Use Node.js required by Expo 57
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Check Expo dependency versions
        run: npx expo install --check

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
        working-directory: mobile/android

      - name: Prepare the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk LivePark-stage1.apk

      - name: Store this commit's APK
        uses: actions/upload-artifact@v4
        with:
          name: LivePark-APK-${{ github.sha }}
          path: mobile/LivePark-stage1.apk
          if-no-files-found: error
          retention-days: 90

      - name: Refresh the optional Stage 1 direct download
        if: github.ref_name == 'feature/livepark-mvp-stage1-to-6-17072672878720083729'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release upload stage1-apk-1 LivePark-stage1.apk --repo "${GITHUB_REPOSITORY}" --clobber; then
            echo "Refreshed the direct APK download with ${GITHUB_SHA}."
          else
            echo "::warning::GitHub did not allow the workflow token to refresh the release. The commit-specific APK artifact was still uploaded successfully."
          fi
